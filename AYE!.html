
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh Yêu Em ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: radial-gradient(circle, #300014, #080008);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.heart {
    position: relative;
    width: 120px;
    height: 120px;
    background: #ff1744;
    transform: rotate(-45deg);
    animation: heartbeat 1s infinite;
    box-shadow: 0 0 40px #ff1744,
                0 0 80px #ff1744;
    margin-bottom: 70px;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    background: #ff1744;
    border-radius: 50%;
}

.heart::before {
    top: -60px;
    left: 0;
}

.heart::after {
    left: 60px;
    top: 0;
}

@keyframes heartbeat {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }
    50% {
        transform: rotate(-45deg) scale(1.2);
    }
}

h1 {
    color: white;
    font-size: 45px;
    text-shadow: 0 0 10px #ff1744,
                 0 0 25px #ff1744;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 0 0 10px pink;
    }
    to {
        text-shadow: 0 0 30px red,
                     0 0 50px #ff1493;
    }
}

p {
    color: pink;
    font-size: 20px;
    margin-top: 20px;
}

.love {
    position: absolute;
    bottom: -30px;
    color: #ff4d79;
    font-size: 25px;
    animation: fly 5s linear forwards;
    pointer-events: none;
}

@keyframes fly {
    0% {
        transform: translateY(0) scale(0.5);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
    }
}

@media (max-width: 500px) {
    h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="heart"></div>

<h1>ANH YÊU EM ❤️</h1>

<p>Em là điều tuyệt vời nhất trong cuộc đời anh!</p>

<script>
function createHeart() {
    const heart = document.createElement("div");

    heart.className = "love";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
        (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
